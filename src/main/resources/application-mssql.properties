# MSSQL – local development
logging.level.org.mundell.mediaservice.service.series.loader=debug

spring.flyway.locations=classpath:db/migration/sqlserver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;DatabaseName=MediaServer;encrypt=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:media}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
