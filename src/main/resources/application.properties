spring.application.name=MediaServer.Service.Series.Loader
management.endpoints.web.exposure.include=health,metrics
spring.main.web-application-type=none
spring.main.banner-mode=off

logging.level.org.mundell.mediaservice.service.series.loader=info

spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Flyway — disabled; migrations are applied by MediaServer only
spring.flyway.enabled=false

# PostgreSQL 17 (default – override per profile)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mediaserver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:media}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
